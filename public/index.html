<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가계부 앱</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>💰 가계부</h1>

        <div class="user-section">
            <div class="user-input">
                <label for="userId">사용자 ID:</label>
                <input type="text" id="userId" placeholder="이름 또는 닉네임 입력">
                <button id="setUserBtn" class="btn-set-user">확인</button>
            </div>
            <div id="currentUser" class="current-user" style="display: none;">
                👤 <span id="userDisplay"></span>
            </div>
        </div>

        <div id="mainApp" style="display: none;">
            <div class="form-section">
                <h2>거래 기록</h2>
                <form id="transactionForm">
                    <div class="form-group">
                        <label for="date">날짜:</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="form-group">
                        <label for="category">카테고리:</label>
                        <select id="category" required>
                            <option value="">선택하세요</option>
                            <option value="food">🍽️ 식비</option>
                            <option value="transport">🚗 교통</option>
                            <option value="entertainment">🎬 오락</option>
                            <option value="utilities">💡 공과금</option>
                            <option value="shopping">🛍️ 쇼핑</option>
                            <option value="salary">💵 급여</option>
                            <option value="other">📌 기타</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="type">유형:</label>
                        <div class="radio-group">
                            <label>
                                <input type="radio" name="type" value="expense" checked> 지출
                            </label>
                            <label>
                                <input type="radio" name="type" value="income"> 수입
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="amount">금액 (원):</label>
                        <input type="number" id="amount" placeholder="0" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="description">설명:</label>
                        <input type="text" id="description" placeholder="선택사항">
                    </div>

                    <button type="submit" class="btn-submit">추가</button>
                </form>
            </div>

            <div class="summary-section">
                <div class="summary-box">
                    <div class="summary-item">
                        <span class="label">수입</span>
                        <span class="amount income" id="totalIncome">0원</span>
                    </div>
                    <div class="summary-item">
                        <span class="label">지출</span>
                        <span class="amount expense" id="totalExpense">0원</span>
                    </div>
                    <div class="summary-item total">
                        <span class="label">잔액</span>
                        <span class="amount" id="totalBalance">0원</span>
                    </div>
                </div>
            </div>

            <div class="list-section">
                <h2>거래 내역</h2>
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">전체</button>
                    <button class="filter-btn" data-filter="income">수입</button>
                    <button class="filter-btn" data-filter="expense">지출</button>
                    <button class="btn-clear">모두 삭제</button>
                </div>
                <ul id="transactionList" class="transaction-list"></ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
